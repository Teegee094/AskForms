<svg xmlns="http://www.w3.org/2000/svg" width="256" height="240" viewBox="0 0 256 240" fill="none">
  <title>AskForms Icon Mark</title>
  <!-- 4 evenly spaced stadium bars (height=32, vertical gap=24) optimized for small & favicon clarity -->
  <rect id="bar-1" x="0" y="0" width="252" height="32" rx="16" fill="#14383E"/>
  <rect id="bar-2" x="0" y="56" width="252" height="32" rx="16" fill="#14383E"/>
  <!-- 3rd bar with wide optical knockout gap (R=27) around overlapping chevron arm -->
  <path id="bar-3" d="M16 112H236A16 16 0 0 1 236 144H229.1L204.8 124.8A27 27 0 0 0 161.1 144H16A16 16 0 0 1 16 112Z" fill="#14383E"/>
  <!-- 4th shorter bottom bar with generous horizontal breathing room before chevron -->
  <rect id="bar-4" x="0" y="168" width="154" height="32" rx="16" fill="#14383E"/>
  <!-- Overlapping rounded right chevron -->
  <path id="chevron" d="M188 146L236 184L188 222" stroke="#14383E" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
