<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AskForms</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <link rel="alternate icon" href="/favicon.ico?v=2" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Merriweather:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=7" />
</head>
<body>
  <div id="app" class="app-shell">
    <div id="brand-lockup" class="brand-lockup" data-action="go-forms"></div>
    <header class="site-header" id="topbar"></header>
    <div class="workspace-body">
      <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
      <aside class="sidebar" id="sidebar"></aside>
      <button type="button" id="sidebar-rail-toggle" class="sidebar-rail-handle" data-action="toggle-sidebar" aria-label="Collapse sidebar" aria-expanded="true" title="Toggle sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="main-column">
        <main class="content" id="content"></main>
      </div>
    </div>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden" aria-hidden="true"></aside>

  <div id="modal-backdrop" class="modal-backdrop hidden"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>

  <div id="ai-fab-root" class="ai-fab-root"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/app.js?v=13"></script>
</body>
</html>
